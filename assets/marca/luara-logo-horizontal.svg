<svg
  viewBox="0 0 420 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titulo descricao"
>
  <title id="titulo">LUARA</title>
  <desc id="descricao">
    Assinatura horizontal da marca LUARA com símbolo geométrico e wordmark.
  </desc>

  <!-- Símbolo -->
  <g transform="translate(16 18) scale(0.70)">
    <polygon points="60,10 20,35 60,60" fill="#F6F3EE"/>
    <polygon points="60,10 100,35 60,60" fill="#B5A1C0"/>
    <polygon points="20,35 20,85 60,60" fill="#54325E"/>
    <polygon points="100,35 100,85 60,60" fill="#8E6B9E"/>
    <polygon points="20,85 60,110 100,85 60,60" fill="#2E1B36"/>
  </g>

  <!-- Wordmark -->
  <text
    x="125"
    y="75"
    fill="#F6F3EE"
    font-family="'Space Grotesk', Arial, sans-serif"
    font-size="52"
    font-weight="600"
    letter-spacing="5"
  >
    LUARA
  </text>
</svg>