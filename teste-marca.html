<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUARA | Teste de Marca</title>

  <style>
    body {
      margin: 0;
      padding: 48px;
      background: #121216;
      color: #F6F3EE;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin-bottom: 48px;
    }

    .teste {
      display: flex;
      align-items: center;
      gap: 40px;
      margin-bottom: 64px;
    }

    .teste div {
      text-align: center;
    }

    .teste img {
      margin: 0 auto 12px;
    }

    .tamanho-96 { width: 96px; }
    .tamanho-48 { width: 48px; }
    .tamanho-32 { width: 32px; }
    .tamanho-16 { width: 16px; }

    .fundo-claro {
      padding: 32px;
      background: #F6F3EE;
      color: #121216;
    }
  </style>
</head>

<body>

  <h1>Teste de robustez — Símbolo LUARA</h1>

  <h2>Versão oficial</h2>

  <div class="teste">
    <div>
      <img class="tamanho-96" src="assets/marca/luara-simbolo.svg" alt="">
      <span>96 px</span>
    </div>

    <div>
      <img class="tamanho-48" src="assets/marca/luara-simbolo.svg" alt="">
      <span>48 px</span>
    </div>

    <div>
      <img class="tamanho-32" src="assets/marca/luara-simbolo.svg" alt="">
      <span>32 px</span>
    </div>

    <div>
      <img class="tamanho-16" src="assets/marca/luara-simbolo.svg" alt="">
      <span>16 px</span>
    </div>
  </div>

  <h2>Monocromático claro</h2>

  <div class="teste">
    <img class="tamanho-96" src="assets/marca/luara-simbolo-claro.svg" alt="">
    <img class="tamanho-48" src="assets/marca/luara-simbolo-claro.svg" alt="">
    <img class="tamanho-32" src="assets/marca/luara-simbolo-claro.svg" alt="">
    <img class="tamanho-16" src="assets/marca/luara-simbolo-claro.svg" alt="">
  </div>

  <div class="fundo-claro">
    <h2>Monocromático escuro</h2>

    <div class="teste">
      <img class="tamanho-96" src="assets/marca/luara-simbolo-escuro.svg" alt="">
      <img class="tamanho-48" src="assets/marca/luara-simbolo-escuro.svg" alt="">
      <img class="tamanho-32" src="assets/marca/luara-simbolo-escuro.svg" alt="">
      <img class="tamanho-16" src="assets/marca/luara-simbolo-escuro.svg" alt="">
    </div>
  </div>

<h2>Micro-símbolo</h2>

<div class="teste">
  <div>
    <img
      class="tamanho-32"
      src="assets/marca/luara-microsimbolo.svg"
      alt="Micro-símbolo LUARA"
    >
    <span>32 px</span>
  </div>

  <div>
    <img
      class="tamanho-16"
      src="assets/marca/luara-microsimbolo.svg"
      alt="Micro-símbolo LUARA"
    >
    <span>16 px</span>
  </div>
</div>

</body>
</html>
